
name: Build Digital Madhesh

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --legacy-peer-deps

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: digital-madhesh-dist
          path: dist/
